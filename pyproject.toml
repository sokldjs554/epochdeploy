[project]
name = "epochdeploy"
version = "0.1.0"
description = "TOCTOU-safe deployment control plane for AI-assisted DevOps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "PyJWT>=2.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
postgres = ["psycopg[binary]>=3.2"]
browser = ["playwright>=1.55,<2"]

[tool.pytest.ini_options]
pythonpath = ["orchestrator"]
testpaths = ["orchestrator/tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "orchestrator"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["orchestrator"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]
