name: 원격 검증

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grpc-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - name: protobuf 생성기 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install grpcio-tools
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Python/Go gRPC 바인딩 생성
        run: |
          bash scripts/generate-grpc.sh
          (cd executor-gin && go mod tidy)
      - name: 생성 바인딩과 모듈 lock 동기화 확인
        run: git diff --exit-code -- executor-gin/gen orchestrator/app/gen executor-gin/go.mod executor-gin/go.sum
      - name: 생성 바인딩 artifact 업로드
        uses: actions/upload-artifact@v7
        with:
          name: epochdeploy-grpc-generated
          path: |
            executor-gin/gen
            orchestrator/app/gen
          if-no-files-found: error

  unit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: executor/go.mod
      - name: Python 프로젝트 설치
        run: python -m pip install '.[test,postgres]'
      - name: Python 테스트
        run: python -m pytest
      - name: Python 패키지 빌드
        run: python -m pip install build && python -m build
      - name: Go vet/race 테스트
        working-directory: executor
        run: go vet ./... && go test -race -count=1 ./...
      - name: Gin executor lock/vet/race 테스트
        working-directory: executor-gin
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go vet ./...
          go test -race -count=1 ./...
      - name: JavaScript 정적 문법 검사
        run: node --check orchestrator/app/static/app.js

  compose-postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compose 모델 검증
        run: docker compose config --quiet
      - name: PostgreSQL 및 서비스 빌드/기동
        run: docker compose up -d --build
      - name: 오케스트레이터 기동 대기
        run: ./scripts/wait-for-http.sh http://127.0.0.1:8000/healthz 90
      - name: PostgreSQL runtime 검증
        run: |
          docker compose exec -T postgres pg_isready -U epochdeploy -d epochdeploy
          docker compose exec -T postgres psql -U epochdeploy -d epochdeploy -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS deployment_epoch_table FROM information_schema.tables WHERE table_schema='public' AND table_name='deployment_epochs';"
      - name: 두 서비스 smoke 반복 검증
        run: |
          for round in 1 2 3; do
            echo "원격 Compose smoke 반복 ${round}"
            BASE=http://127.0.0.1:8000 bash scripts/smoke.sh
          done
      - name: Chromium E2E runtime 설치
        run: |
          python -m pip install '.[browser]'
          python -m playwright install --with-deps chromium
      - name: 전체 제어 플레인 브라우저 E2E
        run: |
          EPOCHDEPLOY_BROWSER_BASE=http://127.0.0.1:8000 \
          EPOCHDEPLOY_BROWSER_OUT=/tmp/epochdeploy-browser-e2e \
          EPOCHDEPLOY_EXPECT_EXECUTOR_IMPLEMENTATION=gin \
          python scripts/browser-e2e.py
      - name: 브라우저 E2E 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epochdeploy-browser-e2e
          path: /tmp/epochdeploy-browser-e2e
          if-no-files-found: ignore
      - name: Compose 로그 수집
        if: always()
        run: docker compose logs --no-color
      - name: 서비스 종료 및 정리
        if: always()
        run: docker compose down -v
