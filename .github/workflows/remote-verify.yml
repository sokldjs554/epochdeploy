name: Remote Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grpc-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
      - name: Install protobuf generators
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install grpcio-tools
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Generate Python and Go gRPC bindings
        run: |
          bash scripts/generate-grpc.sh
          (cd executor-gin && go mod tidy)
      - name: Commit deterministic generated bindings
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [[ -n "$(git status --porcelain -- executor-gin/gen orchestrator/app/gen executor-gin/go.mod executor-gin/go.sum)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add executor-gin/gen orchestrator/app/gen executor-gin/go.mod executor-gin/go.sum
            git commit -m "build: regenerate gRPC bindings"
            git push origin HEAD:"${GITHUB_HEAD_REF}"
          else
            echo "generated bindings already synchronized"
          fi
      - name: Upload generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: epochdeploy-grpc-generated
          path: |
            executor-gin/gen
            orchestrator/app/gen
          if-no-files-found: error

  unit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: executor/go.mod
      - name: Install Python project
        run: python -m pip install '.[test,postgres]'
      - name: Python tests
        run: python -m pytest
      - name: Python package build
        run: python -m pip install build && python -m build
      - name: Go vet and race tests
        working-directory: executor
        run: go vet ./... && go test -race -count=1 ./...
      - name: Gin executor lock, vet and race tests
        working-directory: executor-gin
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go vet ./...
          go test -race -count=1 ./...
      - name: Static JavaScript syntax
        run: node --check orchestrator/app/static/app.js

  compose-postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start PostgreSQL + services
        run: docker compose up -d --build
      - name: Wait for orchestrator
        run: ./scripts/wait-for-http.sh http://127.0.0.1:8000/healthz 90
      - name: Verify PostgreSQL runtime
        run: |
          docker compose exec -T postgres pg_isready -U epochdeploy -d epochdeploy
          docker compose exec -T postgres psql -U epochdeploy -d epochdeploy -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS deployment_epoch_table FROM information_schema.tables WHERE table_schema='public' AND table_name='deployment_epochs';"
      - name: Repeated two-service smoke
        run: |
          for round in 1 2 3; do
            echo "remote compose smoke round ${round}"
            BASE=http://127.0.0.1:8000 bash scripts/smoke.sh
          done
      - name: Install Chromium E2E runtime
        run: |
          python -m pip install '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Browser E2E across all control-plane views
        run: |
          EPOCHDEPLOY_BROWSER_BASE=http://127.0.0.1:8000 \
          EPOCHDEPLOY_BROWSER_OUT=/tmp/epochdeploy-browser-e2e \
          EPOCHDEPLOY_EXPECT_EXECUTOR_IMPLEMENTATION=gin \
          python scripts/browser-e2e.py
      - name: Upload browser E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epochdeploy-browser-e2e
          path: /tmp/epochdeploy-browser-e2e
          if-no-files-found: ignore
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
