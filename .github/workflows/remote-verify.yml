name: Remote Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: executor/go.mod
      - name: Install Python project
        run: python -m pip install '.[test,postgres]'
      - name: Python tests
        run: python -m pytest
      - name: Python package build
        run: python -m pip install build && python -m build
      - name: Go vet and race tests
        working-directory: executor
        run: go vet ./... && go test -race -count=1 ./...
      - name: Gin executor vet and race tests
        working-directory: executor-gin
        run: go mod tidy && go vet ./... && go test -race -count=1 ./...
      - name: Upload generated Gin module lock
        uses: actions/upload-artifact@v7
        with:
          name: epochdeploy-gin-module-lock
          path: executor-gin/go.sum
      - name: Static JavaScript syntax
        run: node --check orchestrator/app/static/app.js

  compose-postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start PostgreSQL + services
        run: docker compose up -d --build
      - name: Wait for orchestrator
        run: ./scripts/wait-for-http.sh http://127.0.0.1:8000/healthz 90
      - name: Verify PostgreSQL runtime
        run: |
          docker compose exec -T postgres pg_isready -U epochdeploy -d epochdeploy
          docker compose exec -T postgres psql -U epochdeploy -d epochdeploy -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS deployment_epoch_table FROM information_schema.tables WHERE table_schema='public' AND table_name='deployment_epochs';"
      - name: Repeated two-service smoke
        run: |
          for round in 1 2 3; do
            echo "remote compose smoke round ${round}"
            BASE=http://127.0.0.1:8000 bash scripts/smoke.sh
          done
      - name: Install Chromium E2E runtime
        run: |
          python -m pip install '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Browser E2E across all control-plane views
        run: |
          EPOCHDEPLOY_BROWSER_BASE=http://127.0.0.1:8000 \
          EPOCHDEPLOY_BROWSER_OUT=/tmp/epochdeploy-browser-e2e \
          EPOCHDEPLOY_EXPECT_EXECUTOR_IMPLEMENTATION=gin \
          python scripts/browser-e2e.py
      - name: Upload browser E2E screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epochdeploy-browser-e2e
          path: /tmp/epochdeploy-browser-e2e
          if-no-files-found: ignore
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
