stages: [verify, integration]

python-tests:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install .[test,postgres]
    - pytest

go-tests:
  stage: verify
  image: golang:1.23
  script:
    - cd executor
    - go vet ./...
    - go test -race ./...

gin-tests:
  stage: verify
  image: golang:1.23
  script:
    - cd executor-gin
    - go mod tidy
    - go vet ./...
    - go test -race ./...

compose-contract:
  stage: integration
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker compose up -d --build
    - apk add --no-cache curl
    - ./scripts/wait-for-http.sh http://docker:8000/healthz 60
    - curl -fsS http://docker:8000/healthz
    - docker compose logs --no-color > compose.log
  after_script:
    - docker compose down -v || true
  artifacts:
    when: always
    paths: [compose.log]
