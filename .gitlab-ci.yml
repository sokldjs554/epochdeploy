stages: [verify, integration]

grpc-codegen:
  stage: verify
  image: golang:1.23
  before_script:
    - apt-get update
    - apt-get install -y protobuf-compiler python3 python3-pip
    - python3 -m pip install --break-system-packages grpcio-tools
    - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
    - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
  script:
    - bash scripts/generate-grpc.sh
    - cd executor-gin && go mod tidy && cd ..
    - git diff --exit-code -- executor-gin/gen orchestrator/app/gen executor-gin/go.mod executor-gin/go.sum

python-tests:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install .[test,postgres]
    - pytest

go-tests:
  stage: verify
  image: golang:1.23
  script:
    - cd executor
    - go vet ./...
    - go test -race ./...

gin-tests:
  stage: verify
  image: golang:1.23
  script:
    - cd executor-gin
    - go mod tidy
    - git diff --exit-code -- go.mod go.sum
    - go vet ./...
    - go test -race ./...

compose-contract:
  stage: integration
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker compose up -d --build
    - apk add --no-cache curl
    - ./scripts/wait-for-http.sh http://docker:8000/healthz 60
    - curl -fsS http://docker:8000/healthz
    - docker compose logs --no-color > compose.log
  after_script:
    - docker compose down -v || true
  artifacts:
    when: always
    paths: [compose.log]
